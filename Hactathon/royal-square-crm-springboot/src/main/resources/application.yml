spring:
  application:
    name: royal-square-crm

  datasource:
    # Supabase gives you this string under Project settings, Database.
    # Never commit the real one - these read from the environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/royalsquare}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # validate, never update. Flyway owns the schema; letting Hibernate alter
      # tables at boot is how a production database quietly loses a column.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Johannesburg
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    za.co.royalsquare.crm: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
