spring.application.name=${APP_NAME:royal-square-crm}

spring.security.user.name=${APP_SECURITY_USER:admin}
spring.security.user.password=${APP_SECURITY_PASSWORD:admin}
spring.security.user.roles=${APP_SECURITY_ROLES:ADMIN}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/royalsquare}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Africa/Johannesburg}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

server.port=${SERVER_PORT:8080}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}

logging.level.za.co.royalsquare.crm=${APP_LOG_LEVEL:DEBUG}

#---
spring.config.activate.on-profile=test

spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${TEST_JPA_DDL_AUTO:create-drop}
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}
