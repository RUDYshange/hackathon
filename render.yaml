# ==============================================================================
# Render Blueprint — Royal Square CRM (single combined service)
# One Docker web service builds the React SPA and serves it from Django/gunicorn
# alongside the API (same origin, no CORS), plus a managed PostgreSQL database.
#
#   * royal-square-crm-db  — managed PostgreSQL
#   * royal-square-crm     — Django + built React SPA (Docker), serves everything
#
# GROQ_API_KEY is a secret: you're prompted for it on the first Blueprint sync.
# DJANGO_SECRET_KEY is generated automatically. The app trusts its own
# onrender.com host automatically (RENDER_EXTERNAL_HOSTNAME in settings.py).
# ==============================================================================
databases:
  - name: royal-square-crm-db
    databaseName: royalsquare
    user: royalsquare
    plan: free
    region: oregon

services:
  - type: web
    name: royal-square-crm
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Django generates a strong secret on first sync.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # DB connection string is wired automatically from the managed database.
      - key: DATABASE_URL
        fromDatabase:
          name: royal-square-crm-db
          property: connectionString
      # Secret — you are prompted for this on the initial Blueprint sync.
      # Powers the voice assistant + whole-app translation. Get a free key at
      # https://console.groq.com  (the app runs without it; those features no-op).
      - key: GROQ_API_KEY
        sync: false
      - key: ASSISTANT_ENABLE_WRITE_ACTIONS
        value: "True"
